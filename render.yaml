# Configuração do Render (Blueprint) — versão gratuita, com o banco de dados
# em um PostgreSQL externo (ex.: Neon), em vez de disco pago do Render.
#
# No painel do Render: "New +" -> "Blueprint" -> selecione este repositório.
# O Render lê este arquivo e já propõe o serviço configurado abaixo.
#
# IMPORTANTE: crie o banco PostgreSQL grátis (ex.: em neon.tech) ANTES de criar
# este serviço, e tenha a "connection string" dele em mãos — ela é pedida na
# tela de criação, na variável DATABASE_URL. Veja o guia
# LEIA-ME_BANCO_POSTGRES_GRATIS.md para o passo a passo completo.

services:
  - type: web
    name: fmabc-eventos
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "waitress-serve --listen=0.0.0.0:$PORT app:app"
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: APP_BASE_URL
        sync: false
      - key: LEMBRETES_AUTOMATICOS
        value: "1"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.7"

# Quer manter o plano pago "Starter" com disco persistente (SQLite) em vez
# de um PostgreSQL externo? Troque "plan: free" por "plan: starter" e volte a
# incluir a seção "disk" (veja a versão anterior deste arquivo no histórico do
# projeto, ou peça para eu recriar essa variante).
