{% set tab_info = event_tab_info(event.id) %}
<nav class="event-tabs" aria-label="Seções do evento">
  <a class="event-tab {% if request.endpoint == 'event_detail' %}is-active{% endif %}" href="{{ url_for('event_detail', event_id=event.id) }}" {% if request.endpoint == 'event_detail' %}aria-current="page"{% endif %}>Resumo</a>
  <a class="event-tab {% if request.endpoint == 'event_checklist' %}is-active{% endif %}" href="{{ url_for('event_checklist', event_id=event.id) }}" {% if request.endpoint == 'event_checklist' %}aria-current="page"{% endif %}>Checklist{% if tab_info.tasks_total %} <span class="event-tab-badge" id="tab-checklist-badge">{{ tab_info.tasks_done }}/{{ tab_info.tasks_total }}</span>{% endif %}</a>
  <a class="event-tab {% if request.endpoint == 'event_run_sheet' %}is-active{% endif %}" href="{{ url_for('event_run_sheet', event_id=event.id) }}" {% if request.endpoint == 'event_run_sheet' %}aria-current="page"{% endif %}>Roteiro</a>
  <a class="event-tab {% if request.endpoint == 'event_budget' %}is-active{% endif %}" href="{{ url_for('event_budget', event_id=event.id) }}" {% if request.endpoint == 'event_budget' %}aria-current="page"{% endif %}>Orçamento</a>
  <a class="event-tab {% if request.endpoint == 'event_incidents' %}is-active{% endif %}" href="{{ url_for('event_incidents', event_id=event.id) }}" {% if request.endpoint == 'event_incidents' %}aria-current="page"{% endif %}>Ocorrências</a>
  <a class="event-tab" href="{{ url_for('event_detail', event_id=event.id) }}#anexos">Anexos{% if tab_info.attachments %} <span class="event-tab-badge">{{ tab_info.attachments }}</span>{% endif %}</a>
  <a class="event-tab" href="{{ url_for('event_detail', event_id=event.id) }}#linha-do-tempo">Linha do tempo</a>
</nav>
